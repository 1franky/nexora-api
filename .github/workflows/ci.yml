name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cachear dependencias de Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar y ejecutar pruebas
        run: ./gradlew build

  respaldos:
    # Respaldo y restauración de punta a punta (ops/respaldos/), con la imagen de PostgreSQL de compose.yaml y el
    # esquema real de las migraciones de Flyway.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: restic 0.19.1 (binario oficial, verificado)
        run: |
          curl -fsSLo restic.bz2 https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2
          echo "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  restic.bz2" | sha256sum -c -
          bunzip2 restic.bz2 && chmod +x restic && sudo mv restic /usr/local/bin/restic
          restic version

      - name: Respaldar, restaurar y comparar
        run: ops/respaldos/probar.sh
