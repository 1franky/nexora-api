        name:
          type: string
          minLength: 1
      required:
      - name
    UpdateCreditCardPurchaseRequest:
      type: object
      description: Solo para compras de contado (sin plan) — se rechaza si la compra
        pertenece a un plan MSI/MCI.
      properties:
        amount:
          type: number
          minimum: 0.0
        categoryId:
          type:
          - string
          - "null"
          format: uuid
        date:
          type: string
          format: date
        description:
          type:
          - string
          - "null"
        merchant:
          type: string
          minLength: 1
        reference:
          type:
          - string
          - "null"
      required:
      - amount
      - date
      - merchant
    UpdateCreditCardRequest:
      type: object
      properties:
        bank:
          type: string
          minLength: 1
        closingDay:
          type: integer
          format: int32
          description: Día del mes (1-28) en que cierra el ciclo de facturación.
          maximum: 28
          minimum: 1
        creditLimit:
          type: number
          minimum: 0.0
        name:
          type: string
          minLength: 1
        paymentDueDay:
          type: integer
          format: int32
          description: "Día del mes (1-28) límite para pagar sin recargos, del ciclo\
            \ que ya cerró."
          maximum: 28
          minimum: 1
      required:
      - bank
      - closingDay
      - creditLimit
      - name
      - paymentDueDay
    UpdateInstallmentPlanRequest:
      type: object
      properties:
        amount:
          type: number
          minimum: 0.0
        categoryId:
          type:
          - string
          - "null"
          format: uuid
        date:
          type: string
          format: date
        description:
          type:
          - string
          - "null"
        installmentCount:
          type: integer
          format: int32
          maximum: 60
          minimum: 2
        interestRate:
          type: number
          description: "Tasa simple mensual, en porcentaje. Bloqueada (junto con amount/installmentCount)\
            \ si ya hay alguna cuota pagada."
          minimum: 0.0
        merchant:
          type: string
          minLength: 1
        reference:
          type:
          - string
          - "null"
      required:
      - amount
      - date
      - installmentCount
      - merchant
    UpdateTransactionRequest:
      type: object
      description: Solo INCOME/EXPENSE — ver TransactionController.
      properties:
        amount:
          type: number
          minimum: 0.0
        categoryId:
          type:
          - string
          - "null"
          format: uuid
        date:
          type: string
          format: date
        description:
          type:
          - string
          - "null"
        reference:
          type:
          - string
          - "null"
      required:
      - amount
      - date
    UserResponse:
      type: object
      description: Datos públicos de un usuario.
      properties:
        createdAt:
          type: string
          format: date-time
        displayName:
          type: string
        email:
          type: string
        id:
          type: string
          format: uuid
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Access token obtenido en POST /api/v1/auth/login (o /refresh).
