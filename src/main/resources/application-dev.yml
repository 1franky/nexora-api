# Perfil de desarrollo local (Mac).
#
# La app corre contenerizada junto con Postgres (ver compose.yaml, servicio
# "api"), en la misma red interna de Docker. El datasource (DB_URL,
# DB_USERNAME, DB_PASSWORD) lo inyecta compose.yaml como variables de
# entorno; no se define aquí.
spring:
  jpa:
    show-sql: true

logging:
  level:
    com.nexora.api: DEBUG
    org.hibernate.SQL: DEBUG
