spring:
  application:
    name: nexora-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:3005}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

nexora:
  exchange-rate:
    # Frankfurter (frankfurter.dev): tipos de cambio de referencia del BCE, gratis, sin API key.
    api-base-url: ${NEXORA_EXCHANGE_RATE_API_BASE_URL:https://api.frankfurter.dev/v1}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
  cors:
    # nexora-web es una SPA: las peticiones salen del navegador del usuario
    # (un origen distinto al de esta API), no del contenedor de nexora-web.
    # Lista separada por comas; en el VPS debe incluir el dominio público real.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3006}
  mail:
    # B10 (recuperación de contraseña): Resend, vía su API HTTP. Vacío en dev
    # local = el código se loguea en vez de enviarse (ver ResendEmailSender).
    # En el VPS SIEMPRE debe tener un valor real.
    resend-api-key: ${RESEND_API_KEY:}
    from-address: ${MAIL_FROM_ADDRESS:noreply@contacto.franciscolopez.uk}
    from-name: ${MAIL_FROM_NAME:Nexora}
